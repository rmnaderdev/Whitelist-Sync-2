// Shared NeoForge build logic, applied via `apply from` from each neoforge-* subproject.
// The subproject's own build.gradle declares the plugins; its gradle.properties supplies
// the per-version values, `java_version` (21|25), and (pre-26 only) parchment_* props.
def javaVer = JavaVersion.toVersion(project.findProperty('java_version') ?: '21')

version = project.mod_version
group = project.mod_group_id

java {
    sourceCompatibility = javaVer
    targetCompatibility = javaVer
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'} [neoforge java=${javaVer}]"

ext.buildNumber = System.getenv().BUILD_NUMBER ?: "Dev"

neoForge {
    version = project.neo_version

    if (project.hasProperty('parchment_mappings_version')) {
        parchment {
            mappingsVersion = project.parchment_mappings_version
            minecraftVersion = project.parchment_minecraft_version
        }
    }

    runs {
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Shared source of truth for the files that are identical across every neoforge version.
sourceSets.main.java.srcDir "$rootDir/neoforge-common/java"
sourceSets.main.resources.srcDir "$rootDir/neoforge-common/resources"

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Core library (shaded into the mod jar)
    shade project(path: ':WhitelistSyncCore', configuration: 'shadow')
    runtimeOnly project(path: ':WhitelistSyncCore', configuration: 'shadow')
}

processResources {
    filesMatching(['pack.mcmeta', 'neoforge.mods.toml', 'META-INF/neoforge.mods.toml', 'mixins.json', '*.mixins.json']) {
        expand project.properties
    }
}

jar {
    archiveClassifier.set('slim')
    manifest {
        attributes([
                "Specification-Title"     : "${project.name}",
                "Specification-Vendor"    : "rmnaderdev",
                "Specification-Version"   : "${project.version}",
                "Implementation-Title"    : "${project.name}",
                "Implementation-Version"  : "${project.version}",
                "Implementation-Vendor"   : "rmnaderdev",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

shadowJar {
    archiveBaseName = "WhitelistSync"
    archiveClassifier = "neoforge-${minecraft_version}"
    destinationDirectory = file '../target'
    configurations = [project.configurations.shade]
}
assemble.dependsOn shadowJar

artifacts {
    archives shadowJar
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def changeLogProvider = rootProject.providers.fileContents(
        rootProject.layout.projectDirectory.file("CHANGELOG.md")
).asText

unifiedPublishing {
    project {
        changelog = changeLogProvider.present ? changeLogProvider.get() : "No changelog."
        releaseType = "release"
        gameVersions = [minecraft_version]
        gameLoaders = ["neoforge"]
        mainPublication tasks.shadowJar
        var cfToken = System.getenv("CF_TOKEN")
        System.println("Curseforge token: ${cfToken != null}")
        if (cfToken != null && System.getenv("GITHUB_REF")?.startsWith("refs/tags/")) {
            curseforge {
                token = cfToken
                id = "274793"
                displayName = "WhitelistSync-${project.version}-neoforge-${minecraft_version}"
            }
        } else {
            System.out.println("Curseforge publication skipped.")
        }
        var mrToken = System.getenv("MODRINTH_TOKEN")
        System.println("Modrinth token: ${mrToken != null}")
        if (mrToken != null && System.getenv("GITHUB_REF")?.startsWith("refs/tags/")) {
            modrinth {
                token = mrToken
                id = "DcCsQ8S5"
                displayName = "Whitelist Sync (NeoForge ${minecraft_version})"
                version = "${minecraft_version}-${project.version}"
            }
        } else {
            System.out.println("Modrinth publication skipped.")
        }
    }
}
