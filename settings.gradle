pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url "https://papermc.io/repo/repository/maven-public/" }
        maven { url "https://maven.fabricmc.net/" }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url "https://maven.architectury.dev/" }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'net.fabricmc.fabric-loom-remap' version '1.14-SNAPSHOT' apply false
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3' apply false
    id 'com.gradleup.shadow' version '9.2.2' apply false
    id 'me.shedaniel.unified-publishing' version "0.1.+" apply false
}

rootProject.name = 'WhitelistSync2'

// Single source of truth for the mod version — managed by release-please.
// See version.txt / .release-please-manifest.json. Injected as the `mod_version`
// project property before any build.gradle is evaluated, replacing the old
// gradle.properties entry.
def modVersion = new File(settingsDir, 'version.txt').text.trim()
gradle.beforeProject { project ->
    project.ext.mod_version = modVersion
}

include ':WhitelistSyncCore'

// Only the selected loader/Minecraft modules are included, so IDE import and Gradle
// configuration don't resolve/decompile every Minecraft version.
// Selector (first match wins): -Pmc=... on the command line, `mc=...` in local.properties
// (gitignored; use this for IntelliJ), otherwise "latest".
//   latest                     newest version of each loader (default)
//   all                        every version in versions.properties (what CI/release use)
//   1.21.8,26.2                these versions, for every loader that has them
//   fabric-1.21.8,neoforge-26.2  exact modules
def versionsFile = new Properties()
new File(settingsDir, 'versions.properties').withInputStream { versionsFile.load(it) }

def localProps = new Properties()
def localFile = new File(settingsDir, 'local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}

def selector = (settings.providers.gradleProperty('mc').getOrNull() ?: localProps.getProperty('mc') ?: 'latest').trim()
def tokens = selector.split(',').collect { it.trim() }.findAll { !it.isEmpty() }

def selectedModules = []
['fabric', 'neoforge'].each { loader ->
    def versions = versionsFile.getProperty(loader).split(',').collect { it.trim() }
    versions.each { v ->
        def module = "${loader}-${v}".toString()
        def selected = tokens.any { t ->
            t == 'all' || t == module || t == v || (t == 'latest' && v == versions.last())
        }
        if (selected) {
            selectedModules << module
        }
    }
}

if (selectedModules.isEmpty()) {
    throw new GradleException("mc='${selector}' matched no modules. See versions.properties for valid versions.")
}

selectedModules.each { include ":${it}" }
println "Whitelist Sync 2 modules: ${selectedModules.join(', ')}  (mc=${selector})"

