name: build
on:
  pull_request:
  workflow_dispatch:

# Serialize overlapping runs so they don't share the Gradle cache/journal lock.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Derive the list of loader subprojects from settings.gradle so new MC
  # versions are picked up automatically without editing this workflow.
  matrix:
    runs-on: self-hosted
    outputs:
      projects: ${{ steps.gen.outputs.projects }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: generate project matrix
        id: gen
        run: |
          projects=$(grep -oE "(fabric|neoforge)-[0-9][^']*" settings.gradle | sort -u)
          json=$(printf '%s\n' $projects | sed 's/.*/"&"/' | paste -sd, -)
          echo "projects=[$json]" >> "$GITHUB_OUTPUT"
          echo "Matrix: [$json]"

  build:
    needs: matrix
    runs-on: self-hosted
    strategy:
      # Build every version even if one fails, so a single broken module does
      # not hide the status of the rest.
      fail-fast: false
      # Serial: all matrix jobs share the one /gradle-cache on this box. Running
      # them in parallel either deadlocks on the journal lock (shared home) or
      # duplicates the multi-GB cache per project and fills the disk (isolated
      # home). Serial keeps the cache warm, small, and lock-free.
      max-parallel: 1
      matrix:
        project: ${{ fromJson(needs.matrix.outputs.projects) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Install both JDKs. 1.21.x compiles on Java 21, 26.x on Java 25; the
      # Gradle toolchain picks the right one per module.
      - name: set up Java 21 + 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      # Self-hosted runner persists the Gradle home on disk, so the GitHub
      # Actions cache is redundant — and uploading multi-GB tarballs over the
      # runner's slow link stalls the job. Disable it.
      - name: set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build ${{ matrix.project }}
        run: >-
          ./gradlew :${{ matrix.project }}:build
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64,JAVA_HOME_21_ARM64,JAVA_HOME_25_ARM64
