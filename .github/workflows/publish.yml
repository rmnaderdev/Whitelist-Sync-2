name: publish
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Same dynamic matrix as build.yml — publish one subproject per job to keep
  # peak memory bounded (building all loader workspaces at once OOMs).
  matrix:
    runs-on: self-hosted
    outputs:
      projects: ${{ steps.gen.outputs.projects }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: generate project matrix
        id: gen
        run: |
          projects=$(awk -F= '/^[a-z]+=/{n=split($2,v,","); for(i=1;i<=n;i++) print $1"-"v[i]}' versions.properties)
          json=$(printf '%s\n' $projects | sed 's/.*/"&"/' | paste -sd, -)
          echo "projects=[$json]" >> "$GITHUB_OUTPUT"
          echo "Matrix: [$json]"

  # Fail fast if either API token is missing or rejected, before building/publishing.
  verify-tokens:
    runs-on: self-hosted
    steps:
      - name: verify CurseForge and Modrinth tokens
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
        run: |
          fail=0
          cf=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Api-Token: $CF_TOKEN" https://minecraft.curseforge.com/api/game/versions)
          if [ "$cf" != "200" ]; then echo "::error::CurseForge token check failed (HTTP $cf)"; fail=1; fi
          mr=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: $MODRINTH_TOKEN" https://api.modrinth.com/v2/user)
          if [ "$mr" != "200" ]; then echo "::error::Modrinth token check failed (HTTP $mr)"; fail=1; fi
          exit $fail

  # Build every project first (no tokens). The publish job only starts if ALL
  # builds succeed, so a failed build never leaves partial releases behind.
  build:
    needs: [matrix, verify-tokens]
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.matrix.outputs.projects) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: set up Java 21 + 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build ${{ matrix.project }}
        run: >-
          ./gradlew :${{ matrix.project }}:build -Pmc=${{ matrix.project }} --stacktrace
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64,JAVA_HOME_21_ARM64,JAVA_HOME_25_ARM64

  publish:
    needs: [matrix, build]
    runs-on: self-hosted
    strategy:
      fail-fast: false
      # Publish sequentially to avoid tripping CurseForge/Modrinth rate limits.
      max-parallel: 1
      matrix:
        project: ${{ fromJson(needs.matrix.outputs.projects) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: set up Java 21 + 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      # Runner persists the Gradle home on disk; skip the redundant (and slow
      # to upload) GitHub Actions cache.
      - name: set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: publish ${{ matrix.project }} to Modrinth and CurseForge
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
        run: >-
          ./gradlew :${{ matrix.project }}:publishUnified -Pmc=${{ matrix.project }} --info --stacktrace
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64,JAVA_HOME_21_ARM64,JAVA_HOME_25_ARM64
